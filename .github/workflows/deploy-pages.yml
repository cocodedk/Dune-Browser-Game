name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # og.png is rendered from website/og-image.html by scripts/render-og.mjs;
      # this is the only step in this workflow that needs a real browser.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build game
        run: npm run build

      # website/ is the static marketing site; the Vite build output lands at
      # app/ underneath it, and og.png is rendered alongside it, so the whole
      # thing can be uploaded as a single Pages artifact.
      - name: Assemble Pages site
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site/app
          cp -r website/. .pages-site/
          cp -r dist/. .pages-site/app/

      - name: Render og.png
        run: node scripts/render-og.mjs .pages-site/og.png

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: '.pages-site'
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
