name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # `npm test` is Playwright. It was invoked as `npm test -- --run`, and
      # --run is a Vitest flag that Playwright's CLI rejects outright with
      # "unknown option '--run'" — so the step failed instantly, every time,
      # and continue-on-error swallowed it. Browsers were never installed
      # either. The end-to-end suite has therefore never run in CI: the badge
      # was green because nothing was being checked.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: End-to-end tests
        run: npm test
