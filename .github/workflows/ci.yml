name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # `npm test` is Playwright. It was invoked as `npm test -- --run`, and
      # --run is a Vitest flag that Playwright's CLI rejects outright with
      # "unknown option '--run'" — so the step failed instantly, every time,
      # and continue-on-error swallowed it. Browsers were never installed
      # either. The end-to-end suite has therefore never run in CI: the badge
      # was green because nothing was being checked.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      # This runner has no GPU. playwright.config.ts forces GPU launch
      # flags that need a windowing system (ANGLE's `gl` backend) — with
      # no display at all, Chromium falls through to SwiftShader, which
      # is too slow for this suite's 3D specs (measured: real GPU ~6s per
      # spec, no display ~timeout). Xvfb gives it a display, which routes
      # the same flags to Mesa's llvmpipe software rasterizer instead —
      # much faster, and (per playwright.config.ts's `workers` comment)
      # fast enough for the full suite at one worker. `xvfb-run` ships on
      # ubuntu-latest; the `which` guard is a cheap safety net, not an
      # assumption it's missing.
      - name: End-to-end tests
        run: |
          which xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
          xvfb-run -a npm test
