<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ornithopter — vehicle shop</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; background: #0b0a09; }
      canvas { display: block; }
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8dcc4; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      #readout { position: absolute; top: 12px; left: 14px; white-space: pre; opacity: 0.92; }
      #keys { position: absolute; bottom: 12px; left: 14px; white-space: pre; opacity: 0.62; }
      #mode { position: absolute; top: 12px; right: 14px; text-align: right; opacity: 0.92; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="readout"></div>
      <div id="mode"></div>
      <div id="keys"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
